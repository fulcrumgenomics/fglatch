name: Code checks

on:
  push:
  workflow_call:

env:
  UV_VERSION: 0.8.3

jobs:
  Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        PYTHON_VERSION: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          python-version: "${{ matrix.PYTHON_VERSION }}"
          enable-cache: 'true'
          cache-suffix: "${{ matrix.PYTHON_VERSION }}"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Set up Latch
        env:
          FULCRUM_LATCH_WORKSPACE_ID: ${{ secrets.FULCRUM_LATCH_WORKSPACE_ID }}
          FULCRUM_DEV_LATCH_USER_API_TOKEN: ${{ secrets.FULCRUM_DEV_LATCH_USER_API_TOKEN }}
        run: |
          mkdir -p ~/.latch
          printf '{"workspace_id": "%s", "name": "Fulcrum Genomics"}' \
            "$FULCRUM_LATCH_WORKSPACE_ID" > ~/.latch/workspace
          printf '%s' "$FULCRUM_DEV_LATCH_USER_API_TOKEN" > ~/.latch/token

      - name: Test the library
        run: |
          uv run poe check-all

