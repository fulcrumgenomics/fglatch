name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  UV_VERSION: 0.8.3

jobs:
  tests:
    name: tests
    uses: "./.github/workflows/python_package.yml"

  build-wheels:
    name: build wheels
    needs: tests
    uses: "./.github/workflows/wheels.yml"

  build-sdist:
    name: build source distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "${{ env.UV_VERSION }}"
          python-version: 3.12
          enable-cache: 'true'
          cache-suffix: 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Build package
        run: uv build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fglatch-sdist
          path: dist/*.tar.gz

  # TODO: update to use `uv publish`
  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: packages
          pattern: 'fglatch-*'
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: packages/
          skip-existing: true
          verbose: true

  make-changelog:
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    outputs:
      release_body: "${{ steps.git-cliff.outputs.content }}"
    steps:
      - name: Checkout the Repository at the Tagged Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.ref_name }}"

      - name: Generate a Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        id: git-cliff
        with:
          config: pyproject.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: "${{ github.repository }}"

  make-github-release:
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write
      pull-requests: read
    needs: make-changelog
    steps:
      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: '${{ github.ref_name }}'
          body: '${{ needs.make-changelog.outputs.release_body }}'
          draft: false
          prerelease: false
